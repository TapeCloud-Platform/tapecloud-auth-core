services:
  # Backend - Java/Spring Boot
  backend:
    build:
      context: ./tapecloud-auth-core
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER_CLASS_NAME=${DB_DRIVER_CLASS_NAME}
      - HIBERNATE_DIALECT=${HIBERNATE_DIALECT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - TMDB_BASE_URL=${TMDB_BASE_URL}
      - TMDB_IMAGE_BASE_URL=${TMDB_IMAGE_BASE_URL}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_API_READ_ACCESS_TOKEN=${TMDB_API_READ_ACCESS_TOKEN}
      - MUSICBRAINZ_API_BASE_URL=${MUSICBRAINZ_API_BASE_URL}
      - MUSICBRAINZ_APP_NAME=${MUSICBRAINZ_APP_NAME}
      - MUSICBRAINZ_APP_VERSION=${MUSICBRAINZ_APP_VERSION}
      - MUSICBRAINZ_CONTACT_EMAIL=${MUSICBRAINZ_CONTACT_EMAIL}
      - MUSICBRAINZ_USERNAME=${MUSICBRAINZ_USERNAME}
      - MUSICBRAINZ_AUTH_TOKEN=${MUSICBRAINZ_AUTH_TOKEN}
      - MUSICBRAINZ_OAUTH_CLIENT_ID=${MUSICBRAINZ_OAUTH_CLIENT_ID}
      - MUSICBRAINZ_OAUTH_CLIENT_SECRET=${MUSICBRAINZ_OAUTH_CLIENT_SECRET}
      - MUSICBRAINZ_OAUTH_REDIRECT_URI=${MUSICBRAINZ_OAUTH_REDIRECT_URI}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_BASE_URL=${LASTFM_BASE_URL}
    volumes:
      - ./tapecloud-auth-core/data:/workspace/data
    networks:
      - tapecloud-network
    container_name: tapecloud-backend

  # Portal - React/Vite
  portal:
    build:
      context: ./tapecloud-portal
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./tapecloud-portal/src:/app/src
      - portal_node_modules:/app/node_modules
    networks:
      - tapecloud-network
    container_name: tapecloud-portal
    depends_on:
      - backend

  # TapeFlix - React/Vite
  tapeflix:
    build:
      context: ./tapeflix-app
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./tapeflix-app/src:/app/src
      - tapeflix_node_modules:/app/node_modules
    networks:
      - tapecloud-network
    container_name: tapecloud-tapeflix
    depends_on:
      - backend

  # TapeBeat - React/Vite
  tapebeat:
    build:
      context: ./tapebeat-app
      dockerfile: Dockerfile.dev
    ports:
      - "5175:5175"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./tapebeat-app/src:/app/src
      - tapebeat_node_modules:/app/node_modules
    networks:
      - tapecloud-network
    container_name: tapecloud-tapebeat
    depends_on:
      - backend

networks:
  tapecloud-network:
    driver: bridge

volumes:
  portal_node_modules:
  tapeflix_node_modules:
  tapebeat_node_modules:

