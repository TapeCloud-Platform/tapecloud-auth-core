version: '3.8'

services:
  # Backend - Java/Spring Boot
  backend:
    build:
      context: ./tapecloud-auth-core
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - ./tapecloud-auth-core/data:/workspace/data
    networks:
      - tapecloud-network
    container_name: tapecloud-backend

  # Portal - React/Vite
  portal:
    build:
      context: ./tapecloud-portal
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./tapecloud-portal/src:/app/src
      - ./tapecloud-portal/node_modules:/app/node_modules
    networks:
      - tapecloud-network
    container_name: tapecloud-portal
    depends_on:
      - backend

  # TapeFlix - React/Vite
  tapeflix:
    build:
      context: ./tapeflix-app
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./tapeflix-app/src:/app/src
      - ./tapeflix-app/node_modules:/app/node_modules
    networks:
      - tapecloud-network
    container_name: tapecloud-tapeflix
    depends_on:
      - backend

  # TapeBeat - React/Vite (EN DESARROLLO)
  # Descomenta cuando esté listo (necesita package.json)
  # tapebeat:
  #   build:
  #     context: ./tapebeat-app
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "5175:5175"
  #   environment:
  #     - VITE_API_URL=${VITE_API_URL}
  #   volumes:
  #     - ./tapebeat-app/src:/app/src
  #     - ./tapebeat-app/node_modules:/app/node_modules
  #   networks:
  #     - tapecloud-network
  #   container_name: tapecloud-tapebeat
  #   depends_on:
  #     - backend

networks:
  tapecloud-network:
    driver: bridge
