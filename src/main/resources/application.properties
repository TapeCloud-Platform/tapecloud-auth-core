spring.application.name=tapecloud-sso-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tapecloud}
spring.datasource.username=${DB_USERNAME:tapecloud}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
