spring.application.name=tapecloud-auth-core

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Sin esto, las respuestas de error (404, 409, etc) no incluyen "message" en el
# JSON y el frontend solo puede mostrar un texto genérico.
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tapecloud;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Sin valor por defecto a propósito: el arranque debe fallar si falta un secreto real (ver JwtService).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

tapecloud.admin.emails=${ADMIN_EMAILS:totosanchez2610@gmail.com,admin@tapecloud.com}
# Alta única del primer admin cuando no existe ninguno todavía (ver DataInitializer). Sin valor por defecto.
tapecloud.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
tapecloud.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

totp.issuer=${TOTP_ISSUER:TapeCloud}

tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.image-base-url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p/w500}
tmdb.language=${TMDB_LANGUAGE:es-ES}

lastfm.api-key=${LASTFM_API_KEY:}
lastfm.base-url=${LASTFM_BASE_URL:https://ws.audioscrobbler.com/2.0}

musicbrainz.base-url=${MUSICBRAINZ_API_BASE_URL:https://musicbrainz.org/ws/2}
musicbrainz.app-name=${MUSICBRAINZ_APP_NAME:TapeCloud}
musicbrainz.app-version=${MUSICBRAINZ_APP_VERSION:1.0}
musicbrainz.contact-email=${MUSICBRAINZ_CONTACT_EMAIL:contacto@tapecloud.local}

